# Maven Wrapper.
#
# `./mvnw` downloads this exact Maven into ~/.m2/wrapper on first run and uses
# it thereafter. Nothing is installed system-wide, so no brew formula, no
# openjdk upgrade, and no unrelated dependency churn.
#
# It also pins the build: every machine and CI runner uses this Maven version,
# not whatever happens to be on PATH. That is the same reason the pom pins
# dependency versions through BOMs.
distributionUrl=https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.9.16/apache-maven-3.9.16-bin.zip
wrapperUrl=https://repo.maven.apache.org/maven2/org/apache/maven/wrapper/maven-wrapper/3.3.4/maven-wrapper-3.3.4.jar
