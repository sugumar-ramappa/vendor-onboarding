# Profile for the step-8 measurement.
#
# Web server off so the run exits when it finishes.
spring:
  main:
    web-application-type: none

logging:
  level:
    root: WARN
    com.learning.onboarding.measure: INFO
    # Shows each reviewer's latency and whether it came from cache, which is
    # what makes the cost of a run legible rather than a surprise.
    com.learning.onboarding.agents.ReviewerAgent: INFO
    com.learning.onboarding.graph.ReviewGraph: INFO
