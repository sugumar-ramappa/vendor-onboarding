# The measurement is a batch job, not a service. Port 0 means "any free port",
# so a run cannot collide with a previous one that is still alive, or with an
# ssh tunnel, or with the app running normally on 8080.
#
# It matters because the application is a web app: CommandLineRunner finishes,
# the web server keeps the JVM up, and the process sits there holding 8080 until
# something kills it. The next day's run then fails at startup - which costs no
# quota, but wastes the window if nobody is watching.
# NO WEB SERVER AT ALL for this profile.
#
# port: 0 alone was not enough, and the difference cost fifteen minutes per
# configuration. The measurement finished at 18:33:08 and the JVM was still
# alive at 18:48:29, when it was killed by hand - Tomcat had started, so the
# process had a non-daemon thread and would never exit on its own.
#
# CommandLineRunner completing does not end a web application. With
# web-application-type: none there is no server, so the JVM exits the moment the
# run finishes. That is what makes an unattended multi-day measurement possible
# at all: a run that never terminates cannot be scripted, and a human has to sit
# and watch each configuration to notice it is done.
#
# port: 0 stays as a second line of defence - if something re-enables the web
# stack, it must not collide with the app on 8080 or with an ssh tunnel.
spring:
  main:
    web-application-type: none

server:
  port: 0

# Measurement profile.
#
# The Gemini free tier allows 20 model requests per day per model - the quota id
# is GenerateRequestsPerDayPerProjectPerModel-FreeTier and the value is literally
# 20. With MCP tools the full experiment is ~224 requests, because a tool call is
# a SECOND request: the model pauses, the tool runs, and the result goes back in
# a new one. Four of the five reviewers call a tool.
#
# So the measurement pre-resolves each reviewer's rulebook into its prompt. Same
# SQL, same rows, same prompts - only the delivery changes, and it changes
# identically for every configuration, so the comparison is unaffected.
onboarding:
  model:
    # Off deliberately. With the rulebook already in the prompt, a tool call
    # would fetch what the reviewer has been given and cost a second request -
    # the exact cost the pre-resolution exists to avoid.
    tools-enabled: false

measure:
  prefetch-rules: true
  # Five defective fixtures covering all five review areas, plus two clean packs
  # across two delivery models. F12 is drop-ship, where no ASN is required - the
  # case a reviewer applying general retail knowledge flags wrongly, and
  # therefore where the verifier has something to disprove.
  fixtures: F01,F03,F06,F08,F10,F02,F12
