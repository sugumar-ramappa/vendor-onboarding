spring:
  application:
    name: vendor-onboarding

  servlet:
    multipart:
      # The first bound a vendor's upload meets, and the only one that stops
      # bytes before they are in memory. onboarding.intake.max-file-bytes checks
      # the same 20 MB again inside TextExtractor - by then the file has already
      # been read, so it protects the extractors, not the heap.
      max-file-size: 20MB
      # A pack is nine or ten documents. This is the whole request, so it also
      # caps how many a single submission can carry.
      max-request-size: 120MB

  config:
    # Spring does NOT read .env files the way python-dotenv does. This import
    # treats .env as a properties file, which gives the same ergonomics as the
    # RAG project in this workspace - drop the key in .env and forget about it.
    #
    # `optional:` means a missing file is not an error, so CI and container
    # deployments can supply GOOGLE_API_KEY as a real environment variable
    # instead. Precedence still favours a genuine env var, which is what you
    # want in production.
    import: optional:file:./.env[.properties]

  datasource:
    # The application's own connection - the only one permitted to write.
    # A separate read-only role for the agents is created in V3.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/vendor_onboarding}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD}

  flyway:
    enabled: true
    # Schema comes from reviewed, ordered migrations - never generated from
    # entities. The SQL that ships is the SQL that was read and tested.
    locations: classpath:db/migration
    baseline-on-migrate: false
    placeholders:
      # Kept out of the migration file so no password is ever committed.
      # V3 creates the read-only role the agents connect as.
      agentPassword: ${AGENT_DB_PASSWORD:agent-local-dev-only}

  ai:
    google:
      genai:
        # Read from the environment so no key is ever committed.
        api-key: ${GOOGLE_API_KEY}
        chat:
          options:
            # Pinned to an explicit version, deliberately NOT gemini-flash-latest.
            # An alias silently changes the model underneath you, which would make
            # the step-8 comparison meaningless - a recall difference between two
            # runs could be the architecture or could be a model swap, and you
            # would have no way to tell.
            #
            # gemini-2.5-flash is retired for new projects; the API's own error
            # points at this one.
            model: gemini-3.6-flash
            # Low, so reviewers do not vary run to run. Otherwise the measurement
            # captures sampling noise instead of the architecture.
            temperature: 0.1

    # The MCP server exposing read-only reference data to the agents.
    mcp:
      server:
        name: vendor-onboarding-tools
        version: 0.1.0

server:
  port: 8080

logging:
  level:
    com.learning.onboarding: DEBUG

# ---------------------------------------------------------------------------
# Review policy.
#
# These live here, NOT in a prompt. That is the central guardrail: no vendor
# document can widen a threshold, because no threshold is ever sent to a model.
# The decision gate reads these in plain Java.
# ---------------------------------------------------------------------------
onboarding:
  policy:
    # A finding at or above this severity blocks onboarding outright.
    blocking-severity: BLOCKING
    # A finding at or above this goes to a person even when it does not block.
    # MAJOR is documented as "needs resolution before onboarding, but a human
    # may waive it" - and waiving requires being shown it. Set equal to
    # blocking-severity to go back to auto-clearing everything below BLOCKING.
    escalation-severity: MAJOR
    # Certificates must remain valid at least this long past the application.
    min-certificate-validity-days: 30
    # Public liability cover required, in GBP.
    min-public-liability: 5000000
  intake:
    # Bounds at the boundary. A vendor uploads these files, so nothing stops a
    # 2GB PDF arriving - and by the time it reaches an agent the memory is gone.
    max-file-bytes: 20971520     # 20 MB
    max-pages: 200
    vision:
      # Scanned certificates are normal, especially from smaller vendors sending
      # a stamped and signed original. Refusing them would make the system
      # unusable rather than safe.
      enabled: true
      # Far lower than max-pages: every vision page is a model call, so an
      # 80-page scanned audit report would be 80 calls. Beyond this a human is
      # cheaper and more reliable.
      max-pages: 15
      # 200 DPI reads stamped certificates reliably; higher mostly grows the
      # image without improving the transcription.
      dpi: 200

  model:
    # Retry, with a first wait past one minute. The free tier limits requests
    # per MINUTE, so a shorter wait is a guaranteed second failure - the window
    # has to roll over. A conventional 1s backoff burns three attempts and
    # reports the reviewer as failed.
    max-attempts: 3
    first-backoff-ms: 35000
    # Concurrent model calls. 3 still rate-limited on the free tier; 2 leaves
    # headroom for the retries above. A rate-limited reviewer is a reviewer that
    # did not run, which forces the whole application to a human - so slower and
    # complete beats faster and half-reviewed.
    concurrency: 2

  limits:
    # Caps that stop a crafted document driving an expensive agent loop.
    max-graph-steps: 20
    max-verifier-passes: 2
    max-tokens-per-application: 60000
